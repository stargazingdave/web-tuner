name: Deploy NoiseD Tuner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out tuner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: tuner
          persist-credentials: false

      - name: Read shared source revisions
        id: sources
        working-directory: tuner
        run: node scripts/dependency-outputs.mjs

      - name: Check out shared web library
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.sources.outputs.web_repository }}
          ref: ${{ steps.sources.outputs.web_revision }}
          path: web
          token: ${{ secrets.NOISED_SOURCE_TOKEN || github.token }}
          persist-credentials: false

      - name: Check out shared DSP
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.sources.outputs.dsp_repository }}
          ref: ${{ steps.sources.outputs.dsp_revision }}
          path: dsp
          token: ${{ secrets.NOISED_SOURCE_TOKEN || github.token }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            tuner/package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix web
          npm ci --prefix tuner

      - name: Install Rust and WASM target
        run: rustup toolchain install 1.98.0 --profile minimal --target wasm32-unknown-unknown

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build static app
        working-directory: tuner
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build

      - name: Verify detector, worklet, and shared controls
        working-directory: tuner
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          npm test
          npm run test:rust
          npm run test --prefix ../web/ui

      - name: Upload site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: tuner/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
